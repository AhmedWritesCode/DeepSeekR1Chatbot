<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strawberry Magic Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-pink: #ff6b9d;
            --light-pink: #ffb6c1;
            --lighter-pink: #ffecef;
            --dark-pink: #d44d7a;
            --white: #ffffff;
            --gradient-start: #ff9a9e;
            --gradient-end: #fad0c4;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--lighter-pink), var(--white));
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background-color: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }
        
        h2 {
            color: var(--dark-pink);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            position: relative;
            padding-bottom: 15px;
        }
        
        h2::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            border-radius: 3px;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.15);
            border-radius: 50px;
            overflow: hidden;
        }
        
        .form-control {
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 16px;
            background-color: var(--lighter-pink);
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.3);
            background-color: var(--white);
        }
        
        .btn-send {
            background: linear-gradient(45deg, var(--primary-pink), var(--dark-pink));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
            position: absolute;
            right: 5px;
            top: 5px;
            height: calc(100% - 10px);
        }
        
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
        }
        
        .btn-send:active {
            transform: translateY(0);
        }
        
        #response {
            background-color: var(--white);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-left: 4px solid var(--primary-pink);
            min-height: 100px;
            margin-top: 20px;
            line-height: 1.6;
        }
        
        #response h3 {
            color: var(--dark-pink);
            font-size: 1.3em;
            margin-bottom: 15px;
        }
        
        #response strong {
            color: var(--dark-pink);
            font-weight: 500;
        }
        
        #response ul, #response ol {
            padding-left: 25px;
            margin-bottom: 15px;
        }
        
        #response li {
            margin-bottom: 8px;
        }
        
        #response code {
            background-color: var(--lighter-pink);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        
        #response pre {
            background-color: #f8f8f8;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
        }
        
        .strawberry-decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            opacity: 0.1;
            z-index: 0;
        }
        
        .strawberry-1 {
            top: 20px;
            right: 20px;
            background: radial-gradient(circle, var(--primary-pink) 0%, transparent 70%);
        }
        
        .strawberry-2 {
            bottom: 20px;
            left: 20px;
            background: radial-gradient(circle, var(--primary-pink) 0%, transparent 70%);
        }
        
        .loading-animation {
            display: flex;
            justify-content: center;
            gap: 5px;
            padding: 20px 0;
        }
        
        .loading-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--primary-pink);
            animation: bounce 1.5s infinite ease-in-out;
        }
        
        .loading-dot:nth-child(1) {
            animation-delay: 0s;
        }
        
        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
            
            .btn-send {
                padding: 10px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="strawberry-decoration strawberry-1"></div>
        <div class="strawberry-decoration strawberry-2"></div>
        
        <h2>Strawberry Magic Chat</h2>
        
        <div class="chat-container">
            <div class="input-group">
                <input type="text" class="form-control" id="userInput" placeholder="Ask me anything magical..." aria-label="Ask me anything">
                <button class="btn btn-send" onclick="sendMessage()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
                    </svg>
                </button>
            </div>
            
            <div id="response">
                <p>Welcome to Strawberry Magic Land! ✨🍓 Ask me anything and I'll do my best to help.</p>
            </div>
        </div>
    </div>
    
    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput').value;
            const responseDiv = document.getElementById('response');
            
            if (!input) {
                responseDiv.innerHTML = '<p style="color: var(--dark-pink);">Please enter a magical question!</p>';
                return;
            }
            
            // Add user message to chat
            const userMessage = `<div style="margin-bottom: 20px; text-align: right;">
                <div style="display: inline-block; background: linear-gradient(45deg, var(--primary-pink), var(--dark-pink)); color: white; padding: 12px 20px; border-radius: 18px 18px 0 18px; max-width: 80%;">
                    ${input}
                </div>
            </div>`;
            
            // Show loading animation
            responseDiv.innerHTML = userMessage + `
                <div class="loading-animation">
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                </div>
            `;
            
            try {
                const response = await fetch(
                    'https://openrouter.ai/api/v1/chat/completions',
                    {
                        method: 'POST',
                        headers: {
                            Authorization: 'Bearer <API>',
                            'HTTP-Referer': 'https://www.sitename.com',
                            'X-Title': 'SiteName',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            model: 'deepseek/deepseek-r1:free',
                            messages: [{ role: 'user', content: input }],
                        }),
                    },
                );
                
                const data = await response.json();
                console.log(data);
                const markdownText = data.choices?.[0]?.message?.content || 'No response received.';
                
                // Format the assistant's response
                const assistantResponse = `<div style="margin-top: 20px; text-align: left;">
                    <div style="display: inline-block; background-color: var(--lighter-pink); padding: 12px 20px; border-radius: 18px 18px 18px 0; max-width: 80%;">
                        ${marked.parse(markdownText)}
                    </div>
                </div>`;
                
                responseDiv.innerHTML = userMessage + assistantResponse;
            } catch (error) {
                responseDiv.innerHTML = userMessage + `<div style="color: var(--dark-pink);">Error: ${error.message}</div>`;
            }
            
            // Clear input and scroll to bottom
            document.getElementById('userInput').value = '';
            responseDiv.scrollTop = responseDiv.scrollHeight;
        }
        
        // Allow sending message with Enter key
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
