<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strawberry Magic Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --primary-pink: #ff6b9d;
            --light-pink: #ffb6c1;
            --lighter-pink: #ffecef;
            --dark-pink: #d44d7a;
            --white: #ffffff;
            --gradient-start: #ff9a9e;
            --gradient-end: #fad0c4;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--lighter-pink), var(--white));
            min-height: 100vh;
            margin: 0;
            padding: 0;
            color: #333;
        }
                
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background-color: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
        }
        
        h2 {
            color: var(--dark-pink);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            position: relative;
            padding-bottom: 15px;
        }
        
        h2::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--gradient-start), var(--gradient-end));
            border-radius: 3px;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.15);
            border-radius: 50px;
            overflow: hidden;
        }
        
        .form-control {
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 16px;
            background-color: var(--lighter-pink);
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.3);
            background-color: var(--white);
        }
        
        .btn-send {
            background: linear-gradient(45deg, var(--primary-pink), var(--dark-pink));
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
            position: absolute;
            right: 5px;
            top: 5px;
            height: calc(100% - 10px);
        }
        
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
        }
        
        .btn-send:active {
            transform: translateY(0);
        }
        
        #response {
            background-color: var(--white);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-left: 4px solid var(--primary-pink);
            min-height: 100px;
            margin-top: 20px;
            line-height: 1.6;
            max-height: 500px;
            overflow-y: auto;
        }
        
        #response h3 {
            color: var(--dark-pink);
            font-size: 1.3em;
            margin-bottom: 15px;
        }
        
        #response strong {
            color: var(--dark-pink);
            font-weight: 500;
        }
        
        #response ul, #response ol {
            padding-left: 25px;
            margin-bottom: 15px;
        }
        
        #response li {
            margin-bottom: 8px;
        }
        
        #response code {
            background-color: var(--lighter-pink);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
        
        #response pre {
            background-color: #f8f8f8;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
        }
        
        .strawberry-decoration {
            position: absolute;
            width: 100px;
            height: 100px;
            opacity: 0.1;
            z-index: 0;
        }
        
        .strawberry-1 {
            top: 20px;
            right: 20px;
            background: radial-gradient(circle, var(--primary-pink) 0%, transparent 70%);
        }
        
        .strawberry-2 {
            bottom: 20px;
            left: 20px;
            background: radial-gradient(circle, var(--primary-pink) 0%, transparent 70%);
        }
        
        .loading-animation {
            display: flex;
            justify-content: center;
            gap: 5px;
            padding: 20px 0;
        }
        
        .loading-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--primary-pink);
            animation: bounce 1.5s infinite ease-in-out;
        }
        
        .loading-dot:nth-child(1) {
            animation-delay: 0s;
        }
        
        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        .file-input-container {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .file-input-label {
            background-color: var(--light-pink);
            color: var(--dark-pink);
            padding: 10px 15px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 14px;
            transition: all 0.3s ease;
            margin-right: 10px;
        }
        
        .file-input-label:hover {
            background-color: var(--primary-pink);
            color: white;
        }
        
        #fileInput {
            display: none;
        }
        
        .file-name {
            font-size: 14px;
            color: var(--dark-pink);
            margin-left: 10px;
        }
        
        .preview-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 10px;
            display: block;
        }
        
        .chat-message-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 15px;
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
            
            .btn-send {
                padding: 10px 20px;
            }
            
            .chat-message-image {
                max-width: 200px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="strawberry-decoration strawberry-1"></div>
        <div class="strawberry-decoration strawberry-2"></div>
        
        <h2>Strawberry Magic Chat</h2>
        
        <div class="chat-container">
            <div class="file-input-container">
                <label for="fileInput" class="file-input-label">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="margin-right: 5px;">
                        <path d="M4.406 1.342A5.53 5.53 0 0 1 8 0c2.69 0 4.923 2 5.166 4.579C14.758 4.804 16 6.137 16 7.773 16 9.569 14.502 11 12.687 11H10a.5.5 0 0 1 0-1h2.688C13.979 10 15 8.988 15 7.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 2.825 10.328 1 8 1a4.53 4.53 0 0 0-2.941 1.1c-.757.652-1.153 1.438-1.153 2.055v.448l-.445.049C2.064 4.805 1 5.952 1 7.318 1 8.785 2.23 10 3.781 10H6a.5.5 0 0 1 0 1H3.781C1.708 11 0 9.366 0 7.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383z"/>
                        <path d="M7.646 15.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 14.293V5.5a.5.5 0 0 0-1 0v8.793l-2.146-2.147a.5.5 0 0 0-.708.708l3 3z"/>
                    </svg>
                    Upload Image
                </label>
                <input type="file" id="fileInput" accept="image/*">
                <span id="fileName" class="file-name">No file chosen</span>
                <div id="imagePreview"></div>
            </div>
            
            <div class="input-group">
                <input type="text" class="form-control" id="userInput" placeholder="Ask me anything magical..." aria-label="Ask me anything">
                <button class="btn btn-send" onclick="sendMessage()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/>
                    </svg>
                </button>
            </div>
            
            <div id="response">
                <p>Welcome to Strawberry Magic Land! ✨🍓 Ask me anything and I'll do my best to help. You can upload images for analysis!</p>
            </div>
        </div>
    </div>
    
<script>
    let selectedFile = null;
    let conversationHistory = [
        {
            role: "system",
            content: "You are a helpful assistant named Strawberry Magic Chat. Be friendly, informative, and concise in your responses."
        }
    ];

    // Handle file selection
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const fileNameElement = document.getElementById('fileName');
        const imagePreview = document.getElementById('imagePreview');
        
        if (file) {
            selectedFile = file;
            fileNameElement.textContent = file.name;
            
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.innerHTML = `<img src="${event.target.result}" class="preview-image" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            } else {
                imagePreview.innerHTML = '';
                alert('Please upload an image file (JPEG, PNG, etc.)');
                selectedFile = null;
                fileNameElement.textContent = 'No file chosen';
                e.target.value = '';
            }
        } else {
            selectedFile = null;
            fileNameElement.textContent = 'No file chosen';
            imagePreview.innerHTML = '';
        }
    });
    
    async function sendMessage() {
        const input = document.getElementById('userInput').value;
        const responseDiv = document.getElementById('response');
        
        if (!input && !selectedFile) {
            responseDiv.innerHTML = '<p style="color: var(--dark-pink);">Please enter a message or upload an image!</p>';
            return;
        }
        
        // Add user message to chat UI
        let userMessage = `<div style="margin-bottom: 20px; text-align: right;">
            <div style="display: inline-block; background: linear-gradient(45deg, var(--primary-pink), var(--dark-pink)); color: white; padding: 12px 20px; border-radius: 18px 18px 0 18px; max-width: 80%;">
                ${input || (selectedFile ? 'Analyze this image:' : '')}`;
        
        // Handle image if selected
        if (selectedFile && selectedFile.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const imageUrl = event.target.result;
                const placeholder = responseDiv.querySelector('[data-image-placeholder]');
                if (placeholder) {
                    placeholder.outerHTML = `<img src="${imageUrl}" class="chat-message-image" alt="Uploaded image">`;
                }
            };
            reader.readAsDataURL(selectedFile);
            
            userMessage += `<div data-image-placeholder>[Image: ${selectedFile.name}]</div>`;
        }
        
        userMessage += `</div></div>`;
        
        // Show loading animation
        responseDiv.innerHTML += userMessage + `
            <div class="loading-animation">
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            </div>
        `;
        
        responseDiv.scrollTop = responseDiv.scrollHeight;
        
        try {
            let markdownText = "";
            
            // Add user message to conversation history
            if (selectedFile && selectedFile.type.startsWith('image/')) {
                const base64Image = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(selectedFile);
                });

                conversationHistory.push({
                    role: "user",
                    content: [
                        { type: "text", text: input || "What's in this image?" },
                        { type: "image_url", image_url: { url: `data:image/jpeg;base64,${base64Image}` } }
                    ]
                });
                
                // Call API with conversation history
                const response = await fetch(
                    'https://openrouter.ai/api/v1/chat/completions',
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer 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',
                            'HTTP-Referer': 'https://yourdomain.com',
                            'X-Title': 'Strawberry Magic Chat',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: "qwen/qwen2.5-vl-3b-instruct:free",
                            messages: conversationHistory,
                            max_tokens: 1000
                        }),
                    }
                );
                
                if (!response.ok) throw new Error(`API request failed with status ${response.status}`);
                
                const data = await response.json();
                markdownText = data.choices?.[0]?.message?.content || 'No response received.';
                
                // Add assistant response to history
                conversationHistory.push({
                    role: "assistant",
                    content: markdownText
                });
                
            } else {
                // Text-only message
                conversationHistory.push({
                    role: "user",
                    content: input
                });
                
                const response = await fetch(
                    'https://openrouter.ai/api/v1/chat/completions',
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer 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',
                            'HTTP-Referer': 'https://yourdomain.com',
                            'X-Title': 'Strawberry Magic Chat',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: 'deepseek/deepseek-r1:free',
                            messages: conversationHistory,
                        }),
                    }
                );
                
                const data = await response.json();
                markdownText = data.choices?.[0]?.message?.content || 'No response received.';
                
                conversationHistory.push({
                    role: "assistant",
                    content: markdownText
                });
            }
            
            // Display response
            const assistantResponse = `<div style="margin-top: 20px; text-align: left;">
                <div style="display: inline-block; background-color: var(--lighter-pink); padding: 12px 20px; border-radius: 18px 18px 18px 0; max-width: 80%;">
                    ${marked.parse(markdownText)}
                </div>
            </div>`;
            
            const loadingAnimations = document.querySelectorAll('.loading-animation');
            const lastAnimation = loadingAnimations[loadingAnimations.length - 1];
            
            if (lastAnimation) {
                lastAnimation.outerHTML = assistantResponse;
            }
        } catch (error) {
            console.error('Error:', error);
            const loadingAnimations = document.querySelectorAll('.loading-animation');
            const lastAnimation = loadingAnimations[loadingAnimations.length - 1];
            
            if (lastAnimation) {
                lastAnimation.outerHTML = `<div style="color: var(--dark-pink);">Error: ${error.message}</div>`;
            }
        }
        
        // Clear inputs
        document.getElementById('userInput').value = '';
        document.getElementById('fileInput').value = '';
        document.getElementById('fileName').textContent = 'No file chosen';
        document.getElementById('imagePreview').innerHTML = '';
        selectedFile = null;
        
        responseDiv.scrollTop = responseDiv.scrollHeight;
    }
    
    // Enter key support
    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
</body>
</html>
